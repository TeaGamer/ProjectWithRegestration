<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<title>Logowanie</title>

<style>

/* ===== BODY ===== */

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== BUBBLE ===== */

.login-box{
    background:#1f2937;
    padding:40px;

    width:350px;

    border-radius:15px;

    box-shadow:0 10px 40px rgba(0,0,0,0.5);

    animation:appear 0.6s ease;
}

/* ===== ANIMATION ===== */

@keyframes appear{

from{
opacity:0;
transform:translateY(-20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* ===== TITLE ===== */

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

/* ===== INPUT ===== */

input{

width:100%;

padding:12px;

margin:10px 0;

border-radius:8px;

border:none;

background:#374151;

color:white;

font-size:15px;

}

/* ===== INPUT FOCUS ===== */

input:focus{

outline:none;

background:#4b5563;

}

/* ===== BUTTON ===== */

button{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:8px;

background:#3b82f6;

color:white;

font-size:16px;

cursor:pointer;

transition:0.3s;

}

/* ===== BUTTON HOVER ===== */

button:hover{

background:#2563eb;

transform:scale(1.03);

}

/* ===== LINK ===== */

a{

color:#60a5fa;

text-decoration:none;

}

a:hover{

text-decoration:underline;

}

/* ===== TEXT ===== */

p{

text-align:center;

color:#9ca3af;

margin-top:20px;

}

</style>

</head>

<body>

<div class="login-box">

<h2>Logowanie</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Nazwa użytkownika"
required
>

<input
type="password"
name="password"
placeholder="Hasło"
required
>

<button type="submit">
Zaloguj się
</button>

</form>

<p>
Nie masz konta?
<a href="/register">Zarejestruj się</a>
</p>

</div>

</body>

</html>
