<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> Profile </title>

<style>

/* загальний фон */
body{
background:#0f0f0f;
color:white;
font-family: 'Times New Roman', Times, serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}

/* картка профілю */
.profile-card{
background: #1c1c1c;
padding: 40px;
border-radius: 20px;
width: 420px;
position: relative;
box-shadow:0 0 20px rgba(0,0,0,0.8);
}

/* аватар */
.avatar{
width: 240px;
height: 240px;
border-radius: 50%;
border: 4px solid black;
object-fit: cover;
display: block;
margin: auto;
margin-bottom: 20px;
}

/* інформація */
.info{
margin-top:10px;
}

.info div{
margin:6px 0;
}

/* кнопка редагування */
.edit-btn{
position:absolute;
bottom:20px;
right:20px;
background:#5865F2;
border:none;
padding:10px 18px;
border-radius:10px;
color:white;
cursor:pointer;
}

.edit-btn:hover{
background:#4752c4;
}

/* форма редагування */
#editForm{
display:none;
margin-top:20px;
}

/* поля */
input, select{
width:100%;
padding:8px;
margin:5px 0;
border-radius:6px;
border:none;
}

button{
background:#5865F2;
border:none;
padding:10px;
border-radius:8px;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="profile-card">

<!-- аватар (береться зі static) -->
<img class="avatar" src="/static/avatars/avatar.png">

<!-- інформація користувача -->
<div class="info">

<div><b>Username:</b> {{ current_user.username }}</div>

<div><b>First name:</b> {{ current_user.first_name }}</div>

<div><b>Last name:</b> {{ current_user.last_name }}</div>

<div><b>Age:</b> {{ current_user.age }}</div>

<div><b>Region:</b> {{ current_user.region }}</div>

<div><b>Email:</b> {{ current_user.email }}</div>

<div><b>Password:</b> ********</div>

</div>

<!-- кнопка редагування -->
<button class="edit-btn" onclick="toggleEdit()">Edit</button>

<!-- форма редагування -->
<form id="editForm" method="POST">

<input name="first_name" placeholder="First name">

<input name="last_name" placeholder="Last name">

<input name="age" placeholder="Age">

<input name="email" placeholder="E-mail">

<input name="new_password" type="password" placeholder="New password">

<!-- список регіонів -->
<select name="region">
<option> Poland </option>
<option> Ukraine </option>
<option> Belarus </option>
<option> Kazakhstan </option>
</select>

<button type="submit"> Save </button>

</form>

</div>

<script>

/* показати / сховати форму редагування */

function toggleEdit(){

let form = document.getElementById("editForm");

if(form.style.display === "none"){
form.style.display = "block";
}
else{
form.style.display = "none";
}

}

</script>

</body>
</html>
