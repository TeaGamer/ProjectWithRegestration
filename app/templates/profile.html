
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profil</title>
</head>
<body style="background:#0f0f0f;color:white;font-family:Arial">

<h2>Profil użytkownika</h2>

<form method="POST" enctype="multipart/form-data">
<input name="username" placeholder="Nazwa użytkownika"><br>
<input name="first_name" placeholder="Imię"><br>
<input name="last_name" placeholder="Nazwisko"><br>
<input name="age" placeholder="Wiek"><br>
<input name="new_password" type="password" placeholder="Nowe hasło"><br>
<input name="avatar_path" placeholder="knight.png"><br>
<button>Zapisz zmiany</button>
</form>

<a href="/">Powrót</a>

</body>
</html>
