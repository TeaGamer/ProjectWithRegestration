<!DOCTYPE html>
<html>
<body style="background:#111;color:white;text-align:center;margin-top:150px;font-family:Arial;">

<h2>Register</h2>

<!-- форма реєстрації -->
<form method="POST" autocomplete="on">
    <input name="username"
           placeholder="Username"
           autocomplete="username"><br><br>

    <input name="password"
           type="password"
           placeholder="Password"
           autocomplete="new-password"><br><br>

    <button type="submit">Register</button>
</form>

<a href="/login" style="color:#9FE2BF;">Login</a>

</body>
</html>
