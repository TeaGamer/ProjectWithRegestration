
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Alex</title>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<style>

body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial
}

header{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#1f1f1f
}

.chat{
    height:70vh;
    overflow-y:auto;
    padding:20px
}

.bubble{
    padding:10px;
    border-radius:15px;
    margin:5px 0;
    max-width:60%
}

.user{
    background:#9FE2BF;
    margin-left:auto
}

.ai{
    background:#2b2b2b
}

input{
    width:80%;
    padding:10px;
    border-radius:20px;
    border:none
}

button{
    background:#9FE2BF;
    border:none;
    border-radius:50%;
    width:40px;
    height:40px
    }
</style>
</head>
<body>
    <img src="{{ current_user.avatar }}" width="100">
<header>

<div>Alex {% if online %}
    <span style="color:#9FE2BF">(Online)</span>{% endif %}
</div>

<div>
<a href="/profile">Profil</a>
<a href="/logout">Wyloguj</a>
</div>
</header>

<div class="chat" id="chat">
{% for msg in messages %}
<div class="bubble {{msg.sender}}">
{{msg.text}}
<div style="font-size:12px;opacity:0.6">{{msg.timestamp.strftime("%H:%M %d-%m-%Y")}}</div>
</div>
{% endfor %}
</div>

<input id="msg">
<button onclick="send()">➤</button>

<script>
const socket = io();
function send(){
let text=document.getElementById("msg").value;
socket.emit("send_message",{message:text});
}
socket.on("receive_message",data=>{
let div=document.createElement("div");
div.className="bubble ai";
div.innerHTML=data.text+"<div style='font-size:12px;opacity:0.6'>"+data.time+"</div>";
document.getElementById("chat").appendChild(div);
});
</script>

</body>
</html>
