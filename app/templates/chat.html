<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chat with Alex</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 64px;
            background: #1e1f20;
            border-bottom: 1px solid #333538;
            z-index: 1000;
        }
        .ai-brand { font-size: 20px; font-weight: 500; color: #a8c7fa; }
        .profile-trigger {
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            padding: 6px 12px; border-radius: 20px; transition: 0.2s;
        }
        .profile-trigger:hover { background: #333538; }
        .header-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #333538; }

        /* Chat Layout */
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        #messages {
            flex: 1; overflow-y: auto; padding: 20px 20px 140px 20px;
            display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; width: 100%;
        }
        .message { display: flex; line-height: 1.6; animation: fade 0.3s ease; }
        .message.user { align-self: flex-end; background: #1e1f20; padding: 12px 20px; border-radius: 24px; max-width: 70%; }
        .message.ai { align-self: flex-start; gap: 16px; max-width: 90%; }

        /* Input Area */
        .input-wrapper {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(180deg, transparent, #131314 30%);
            padding-bottom: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .input-area {
            display: flex; background: #1e1f20; border: 1px solid #333538;
            border-radius: 32px; width: 90%; max-width: 800px; padding: 8px 8px 8px 24px; align-items: center;
        }
        .input-area input { flex: 1; border: none; background: transparent; color: white; outline: none; height: 40px; }
        .send-btn { background: transparent; border: none; color: #a8c7fa; cursor: pointer; }

        /* Side Drawer (30%) */
        #profilePanel {
            position: fixed; top: 0; right: -30%; width: 30%; height: 100%;
            background: #1e1f20; box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: 0.3s ease-in-out; z-index: 2000; padding: 25px; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        #profilePanel.active { right: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1500; }
        #overlay.active { display: block; }

        /* Profile Elements */
        .profile-info { text-align: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333538; }
        .user-avatar-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #a8c7fa; }
        
        .profile-scroll { overflow-y: auto; flex: 1; padding-right: 5px; }
        .profile-form { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; color: #a8c7fa; font-weight: bold; }
        .input-group input, .input-group select { 
            background: #131314; border: 1px solid #333538; border-radius: 8px; padding: 9px; color: white; font-size: 14px;
        }
        .input-group input:focus { border-color: #a8c7fa; outline: none; }

        .section-title { font-size: 13px; color: #8ab4f8; margin-top: 10px; border-top: 1px solid #333538; padding-top: 10px; }

        .save-btn {
            background: #a8c7fa; color: #131314; border: none; padding: 12px; 
            border-radius: 24px; font-weight: bold; cursor: pointer; margin-top: 20px;
            width: 100%; transition: 0.2s;
        }
        .save-btn:hover { background: #d2e3fc; }

        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header">
        <div class="ai-brand">Alex</div>
        <div class="profile-trigger" onclick="togglePanel()">
            <span id="headerUserName">User</span>
            <img src="{{ url_for('static', filename='avatar.png') }}" class="header-avatar" onerror="this.src='https://via.placeholder.com/32'">
        </div>
    </header>

    <div id="overlay" onclick="togglePanel()"></div>

    <div id="profilePanel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
            <h3 id="panelTitle" style="margin:0">Profile</h3>
            <span class="material-symbols-outlined" style="cursor:pointer" onclick="togglePanel()">close</span>
        </div>

        <div id="menuContent">
            <div class="profile-info">
                <img src="{{ url_for('static', filename='avatar.png') }}" class="user-avatar-img" onerror="this.src='https://via.placeholder.com/90'">
                <h2 id="userNameLabel" style="margin: 10px 0 5px 0">User</h2>
            </div>
            <button class="save-btn" onclick="showEdit()">Edit Profile</button>
        </div>

        <div id="editContent" style="display:none;" class="profile-scroll">
            <form class="profile-form" id="pForm">
                <div class="input-group"><label>Username</label><input type="text" id="uName" placeholder="New username"></div>

                <div class="section-title">Personal Information</div>
                <div class="input-group"><label>First Name</label><input type="text" id="fName"></div>
                <div class="input-group"><label>Last Name</label><input type="text" id="lName"></div>
                <div class="input-group"><label>Birth Date</label><input type="date" id="bDay"></div>
                <div class="input-group">
                    <label>Region</label>
                    <select id="reg">
                        <option value="Ukraine">Ukraine</option>
                        <option value="Poland">Poland</option>
                        <option value="Belarus">Belarus</option>
                        <option value="Kazakhstan">Kazakhstan</option>
                    </select>
                </div>
                <div class="input-group"><label>E-mail</label><input type="email" id="mail"></div>

                <div class="section-title">Security (Password Change)</div>
                <div class="input-group"><label>New Password</label><input type="password" id="newPass" placeholder="Leave blank if not changing"></div>

                <div style="background: #2a2b2e; padding: 10px; border-radius: 8px; margin-top: 10px;">
                    <div class="input-group">
                        <label style="color: #f28b82;">Confirm Old Password *</label>
                        <input type="password" id="oldPass" required placeholder=" Enter current password to save changes ">
                    </div>
                </div>

                <button type="button" class="save-btn" onclick="processSave()">Save Changes</button>
                <button type="button" style="background:none; border:none; color:#a8c7fa; cursor:pointer; margin-top:10px" onclick="showMenu()">Cancel</button>
            </form>
        </div>
    </div>

    <div class="chat-container">
        <div id="messages"></div>
        <div class="input-wrapper">
            <div class="input-area">
                <input id="messageInput" placeholder="Ask Alex..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        var socket = io();

        function togglePanel() {
            document.getElementById('profilePanel').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            if(!document.getElementById('profilePanel').classList.contains('active')) showMenu();
        }

        function showEdit() {
            document.getElementById('menuContent').style.display = 'none';
            document.getElementById('editContent').style.display = 'block';
            document.getElementById('panelTitle').innerText = 'Editing Profile';
        }

        function showMenu() {
            document.getElementById('menuContent').style.display = 'block';
            document.getElementById('editContent').style.display = 'none';
            document.getElementById('panelTitle').innerText = 'Profile';
        }

        function processSave() {
            const oldPass = document.getElementById('oldPass').value;
            if(!oldPass) {
                alert("For saving changes, please enter your old password!");
                return;
            }

            const bdayValue = document.getElementById('bDay').value;
            if(bdayValue) {
                const bday = new Date(bdayValue);
                const today = new Date();
                let age = today.getFullYear() - bday.getFullYear();
                if (age < 13) { alert("Only for persons older than 13!"); return; }
            }

            const data = {
                username: document.getElementById('uName').value,
                first_name: document.getElementById('fName').value,
                last_name: document.getElementById('lName').value,
                email: document.getElementById('mail').value,
                region: document.getElementById('reg').value,
                new_password: document.getElementById('newPass').value,
                old_password: oldPass
            };

            fetch('/update_profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === 'success') {
                    alert("Data updated!");
                    // Оновлюємо ім'я в інтерфейсі миттєво
                    if(data.username) {
                        document.getElementById('userNameLabel').innerText = data.username;
                        document.getElementById('headerUserName').innerText = data.username;
                    }
                    document.getElementById('oldPass').value = ""; // Очищуємо поле пароля
                    showMenu();
                } else {
                    alert("Error: " + result.message);
                }
            });
        }

        function sendMessage() {
            let input = document.getElementById("messageInput");
            if(input.value.trim() !== "") {
                let box = document.getElementById("messages");
                box.innerHTML += `<div class="message user"><div>${input.value}</div></div>`;
                socket.emit("send_message", {message: input.value});
                input.value = "";
                box.scrollTop = box.scrollHeight;
            }
        }

        socket.on("receive_message", function(data) {
            let box = document.getElementById("messages");
            box.innerHTML += `<div class="message ai"><span style="font-size:20px">✨</span><div>${data.text}</div></div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
