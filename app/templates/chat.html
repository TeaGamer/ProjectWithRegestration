<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> AI Chat </title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* фон */
body{
background:#0f0f0f;
color:white;
font-family:Arial;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
}

/* чат */
#chat{
flex:1;
overflow-y:auto;
padding:30px;
display:flex;
flex-direction:column;
gap:12px;
}

/* повідомлення */
.message{
display:flex;
align-items:flex-start;
gap:10px;
max-width:60%;
}

/* аватар */
.avatar{
width:35px;
height:35px;
border-radius:50%;
}

/* бульбашка */
.bubble{
padding:12px 14px;
border-radius:12px;
}

/* timestamp */
.time{
font-size:11px;
color:#8a8a8a;
margin-top:4px;
}

/* користувач */
.user{
align-self:flex-end;
flex-direction:row-reverse;
}

.user .bubble{
background:#2a2a2a;
}

/* бот */
.bot{
align-self:flex-start;
}

.bot .bubble{
background:#151515;
}

/* markdown code */
pre{
background:#000;
padding:10px;
border-radius:8px;
overflow-x:auto;
}

code{
color:#9cdcfe;
}

/* зона вводу */
#inputArea{

width:50%;
margin:auto;
margin-bottom:25px;

display:flex;
gap:10px;

}

/* поле вводу */
#message{
flex:1;
padding:12px;
border-radius:10px;
border:none;
background:#1f1f1f;
color:white;
}

/* кнопка */
button{
background:#5865F2;
border:none;
padding:12px 18px;
border-radius:10px;
color:white;
cursor:pointer;
}

button:hover{
background:#4752c4;
}

</style>
</head>

<body>

<div id="chat"></div>

<div id="inputArea">

<input id="message" placeholder="Type a message...">

<button onclick="sendMessage()"> Send </button>

</div>

<script>

const socket = io();
const chat = document.getElementById("chat");

/* функція створення повідомлення */

function addMessage(text,type,time){

let msg=document.createElement("div");
msg.classList.add("message",type);

let avatar=document.createElement("img");
avatar.classList.add("avatar");

/* аватар */
if(type==="user"){
avatar.src="/static/avatars/avatar.png";
}
else{
avatar.src="/static/avatars/anonymous.png";
}

/* бульбашка */
let bubble=document.createElement("div");
bubble.classList.add("bubble");

/* markdown */
bubble.innerHTML=marked.parse(text);

/* контейнер тексту */
let container=document.createElement("div");

container.appendChild(bubble);

/* timestamp тільки для бота */
if(type==="bot"){

let timeDiv=document.createElement("div");
timeDiv.classList.add("time");

timeDiv.innerText=time;

container.appendChild(timeDiv);

}

msg.appendChild(avatar);
msg.appendChild(container);

chat.appendChild(msg);

chat.scrollTop=chat.scrollHeight;

}

/* відправка */
function sendMessage(){

let input=document.getElementById("message");
let text=input.value;

if(text==="") return;

addMessage(text,"user","");

socket.emit("send_message",{message:text});

input.value="";

}

/* отримання відповіді */
socket.on("receive_message",function(data){

addMessage(data.text,"bot",data.time);

});

/* Enter */
document.getElementById("message")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
sendMessage();
}

});

</script>

</body>
</html>
