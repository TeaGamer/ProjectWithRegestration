<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> Alex</title>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{
    margin:0;
    background:#0f0f0f;
    font-family:Arial;
    color:white;
}

/* Заголовок */
.header{
    padding:20px;
    margin-left:3cm;
    font-size:22px;
}

/* Зона повідомлень */
#chat{
    height:75vh;
    overflow-y:auto;
    padding:20px;
}

/* Забираємо колізії з float-елементами */
#chat::after{
    content: "";
    display: block;
    clear: both;
}

/* Бульбашка */
.bubble{
    display: inline-block;
    padding:12px 16px;
    margin:8px 0;
    border-radius:20px;
    background:#1f1f1f;
    word-wrap: break-word;
    max-width:60%;
}

/* Повідомлення користувача: вирівнювання праворуч, ширина під текст (до max-width) */
.user{
    float: right;
    background:#2a2a2a;
}

/* Повідомлення AI: вирівнювання ліворуч */
.ai{
    float: left;
    background:#1a1a1a;
}

/* Рядок повідомлення — кожне повідомлення в окремому блоці, щоб наступне йшло під попереднім */
.message-row{
    display:block;
    clear: both;
    width:100%;
}

/* Зона вводу */
.input-area{
    display:flex;
    padding:15px;
    justify-content:center;
    align-items:center;
}

/* Поле вводу (округлене як Telegram) */
input{
    width:50vw; /* приблизно 50% ширини екрану */
    max-width:80%;
    padding:12px;
    border-radius:25px;
    border:none;
    background:#1f1f1f;
    color:white;
    outline:none;
}

/* Кругла кнопка */
button{
    width:50px;
    height:50px;
    margin-left:10px;
    border-radius:50%;
    border:none;
    background:#9FE2BF; /* березовий */
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">Alex</div>

<div id="chat"></div>

<div class="input-area">
    <input id="message" placeholder="Write a message...">
    <button onclick="send()">➤</button>
</div>

<script>
const socket = io();
const input = document.getElementById("message");
const chat = document.getElementById("chat");

// Enter для відправки
input.addEventListener("keypress", e=>{
    if(e.key==="Enter") send();
});

function send(){
    const text = input.value.trim();
    if(!text) return;

    addBubble(text,"user");
    input.value="";

    // відправка на сервер через WebSocket
    socket.emit("send_message",{message:text});
}

// отримання відповіді
socket.on("receive_message", data=>{
    addBubble(data.ai,"ai");
});

// створення бульбашки
function addBubble(text,type){
    const row = document.createElement("div");
    row.className = "message-row";

    const div = document.createElement("div");
    div.className = "bubble " + type;
    div.innerText = text;

    row.appendChild(div);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
