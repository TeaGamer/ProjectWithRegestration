<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> Alex</title>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{
    margin:0;
    background:#0f0f0f;
    font-family:Arial;
    color:white;
}

/* Заголовок */
.header{
    padding:20px;
    margin-left:3cm;
    font-size:22px;
}

/* Зона повідомлень */
#chat{
    height:75vh;
    overflow-y:auto;
    padding:20px;
}

/* Бульбашка */
.bubble{
    max-width:60%;
    padding:12px 16px;
    margin:8px 0;
    border-radius:20px;
    background:#1f1f1f;
}

/* Повідомлення користувача */
.user{
    margin-left:auto;
    background:#2a2a2a;
}

/* Повідомлення AI */
.ai{
    background:#1a1a1a;
}

/* Зона вводу */
.input-area{
    display:flex;
    padding:15px;
}

/* Поле вводу (округлене як Telegram) */
input{
    flex:1;
    padding:12px;
    border-radius:25px;
    border:none;
    background:#1f1f1f;
    color:white;
    outline:none;
}

/* Кругла кнопка */
button{
    width:50px;
    height:50px;
    margin-left:10px;
    border-radius:50%;
    border:none;
    background:#9FE2BF; /* березовий */
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">Alex</div>

<div id="chat"></div>

<div class="input-area">
    <input id="message" placeholder="Write a message...">
    <button onclick="send()">➤</button>
</div>

<script>
const socket = io();
const input = document.getElementById("message");
const chat = document.getElementById("chat");

// Enter для відправки
input.addEventListener("keypress", e=>{
    if(e.key==="Enter") send();
});

function send(){
    const text = input.value.trim();
    if(!text) return;

    addBubble(text,"user");
    input.value="";

    // відправка на сервер через WebSocket
    socket.emit("send_message",{message:text});
}

// отримання відповіді
socket.on("receive_message", data=>{
    addBubble(data.ai,"ai");
});

// створення бульбашки
function addBubble(text,type){
    const div=document.createElement("div");
    div.className="bubble "+type;
    div.innerText=text;
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
